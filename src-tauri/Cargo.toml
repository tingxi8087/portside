[package]
name = "portside"
version = "0.1.0"
description = "A quiet workspace for your Mac"
authors = ["Portside"]
edition = "2021"

[lib]
name = "portside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
base64 = "0.22"
sha2 = "0.10"
rfd = "0.15"
arboard = "3"
